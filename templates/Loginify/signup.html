<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>

<body>

    <h2>Sign Up</h2>

    {% if message %}
    <p>{{ message }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Sign Up</button>
    </form>

    <hr>

    <p>Already have an account?</p>

    <a href="{% url 'login' %}">
        Log In
    </a>

</body>
</html>
